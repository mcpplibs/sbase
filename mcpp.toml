[package]
namespace   = "mcpplibs"
name        = "sbase"
version     = "0.1.0"
description = "The suckless base utilities, recompiled above openkal-musl. The sources are upstream's, unmodified; what changes is the C library beneath them, and with it the set of systems they run on."
license     = "MIT"
authors     = ["mcpplibs"]
repo        = "https://github.com/mcpplibs/sbase"

# One dependency, and it is a C library.
#
# The programs name no operating system, no implementation of openkal and no
# platform. That is the claim this package exists to test: a program is written
# against a C library, and which systems it runs on is a property of that
# library rather than of the program. openkal-musl declares the implementation
# of openkal it needs for the target being built, because it is the only party
# that knows a program above it carries no other runtime.
[dependencies]
openkal-musl = "0.3.1"

[build]
# What a program above this package must say, and why it is one line.
#
# The build tool decides whether to embed a C++ runtime into the program, and
# on one of the three systems its answer is to embed one and to run that
# runtime's initialiser first --- before anything else in the image, including
# the entry point. A program above this package carries no other runtime: the C
# library has not started at that moment, and the embedded initialiser reaches
# it through a guarded static and a mutex and finds nothing there.
#
# `host-coupled' says that the build tool embeds nothing. The system's own C++
# runtime is named instead, and its initialisers run inside it, on the
# facilities it was built against rather than on this library's.
#
# The decision belongs to the program because the build tool reads it from the
# program: a dependency that declared it would be declaring it for itself.
cxx_runtime = "host-coupled"

# The two libraries every tool links against. The tools themselves are not here:
# each is the exclusive entry of a target below, and a source that is both a
# shared object and an entry would put ninety-three definitions of main into
# every link.
sources = ["upstream/libutil/*.c", "upstream/libutf/*.c",
           # Upstream builds these two into archives, so a compatibility
           # definition it carries for a C library that lacks a function is
           # pulled in only when nothing else defines it. This tool links
           # objects rather than archives --- which is why the tools are one
           # package rather than ninety-seven --- so a definition present in
           # both places is present twice.
           #
           # Every other such definition upstream renames (`strlcpy' becomes
           # `xstrlcpy' in util.h, and so on), which is why the list is one
           # entry. It is excluded here rather than deleted: the vendored
           # sources are upstream's, and what this package changes is the C
           # library beneath them and not them.
           "!upstream/libutil/reallocarray.c",
           "compat/*.c"]

include_dirs = ["upstream", "generated"]

# The feature macros upstream's own Makefile states, copied from it rather than
# inferred. They select which declarations the C library's headers expose, and a
# program compiled with a different set from the one its author chose is a
# program whose headers say something else.
cflags = ["-D_DEFAULT_SOURCE", "-D_NETBSD_SOURCE", "-D_BSD_SOURCE",
          "-D_XOPEN_SOURCE=700", "-D_FILE_OFFSET_BITS=64",
          # Upstream builds with warnings on and does not treat them as errors.
          # A vendored copy is not the place to start doing so: a warning here
          # would be a warning about somebody else's source, on a compiler they
          # did not choose.
          "-w"]

[targets.basename]
kind = "bin"
main = "upstream/basename.c"

